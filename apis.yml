name: Iomob
description: 'Iomob (The Internet of Mobility) was a Barcelona-based Mobility-as-a-Service
  (MaaS) technology company founded in 2017. Its platform let cities, transport operators,
  and corporations orchestrate multimodal, door-to-door journeys — combining public
  transit, ride-hailing, taxis, micromobility, parking, and demand-responsive transport
  — through unified journey-planning APIs, native iOS/Android SDKs, and customizable
  white-label apps. Iomob''s MaaS platform and SDK were acquired by Busup in January
  2025 to build a corporate mobility platform; the Iomob UK entity was dissolved in
  September 2025 and the public website (iomob.net) is currently offline (Cloudflare
  526 origin error). No public developer portal, OpenAPI, SDK packages, or GitHub
  organization could be verified during enrichment — Iomob''s APIs and SDKs were delivered
  under B2B/partner agreements.'
